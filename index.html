<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片尺寸工具</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1f4;
      --panel: #ffffff;
      --panel-soft: #f4f6f8;
      --line: #d6dde5;
      --text: #111827;
      --muted: #667085;
      --accent: #0f8f7a;
      --accent-strong: #08715f;
      --gold: #c9962b;
      --danger: #c2414a;
      --shadow: 0 18px 46px rgba(18, 25, 38, 0.13);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(238, 241, 244, 0.94) 48%, rgba(247, 247, 244, 0.96)),
        var(--bg);
      color: var(--text);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(340px, 440px) minmax(0, 1fr);
      gap: 0;
    }

    .sidebar {
      min-height: 100vh;
      padding: 24px;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 44px;
    }

    .mark {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background:
        linear-gradient(135deg, #111827 0 44%, #0f8f7a 44% 73%, #c9962b 73% 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.42);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .brand-copy {
      display: grid;
      gap: 3px;
    }

    .brand-copy span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
    }

    .upload {
      border: 1px dashed #9dabbc;
      border-radius: 8px;
      background: var(--panel-soft);
      padding: 18px;
      display: grid;
      place-items: center;
      text-align: center;
      min-height: 132px;
      transition: border-color 0.18s ease, background 0.18s ease;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.7);
    }

    .upload.is-dragging {
      border-color: var(--accent);
      background: #e4f2ee;
    }

    .upload input {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .upload-label {
      width: 100%;
      display: grid;
      gap: 8px;
      place-items: center;
      color: var(--muted);
      cursor: pointer;
    }

    .upload-label strong {
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
    }

    .file-name {
      width: 100%;
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 10px 28px rgba(18, 25, 38, 0.07);
    }

    .panel-title {
      margin: 0 0 14px;
      font-size: 14px;
      line-height: 1.2;
      color: var(--muted);
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .stack {
      margin-top: 12px;
      display: grid;
      gap: 10px;
    }

    .field label,
    .toggle span,
    .radio-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    input[type="number"],
    input[type="text"],
    select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 9px 10px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    input[type="number"]:focus,
    input[type="text"]:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(31, 122, 104, 0.14);
    }

    input[type="color"] {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 4px;
      background: #fff;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      user-select: none;
    }

    .toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .mode-list {
      display: grid;
      gap: 8px;
    }

    .mode-option {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      align-items: start;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      background: #fff;
    }

    .mode-option:has(input:checked) {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(31, 122, 104, 0.12);
    }

    .mode-option input {
      margin-top: 2px;
      accent-color: var(--accent);
    }

    .mode-copy {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .mode-copy small {
      color: var(--muted);
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .preset-btn {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
    }

    .preset-btn:hover {
      border-color: rgba(15, 143, 122, 0.7);
      background: #edf8f5;
    }

    .image-list {
      display: grid;
      gap: 8px;
      max-height: 150px;
      overflow: auto;
    }

    .image-item {
      width: 100%;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px;
      background: #fff;
      color: var(--text);
      text-align: left;
    }

    .image-item.is-active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 143, 122, 0.13);
    }

    .image-item img {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: 6px;
      background: var(--panel-soft);
    }

    .image-item strong,
    .image-item span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .image-item strong {
      font-size: 12px;
      line-height: 1.25;
    }

    .image-item span {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 10px 12px;
      font-weight: 800;
      color: #fff;
      background: var(--accent);
    }

    .btn:hover {
      background: var(--accent-strong);
    }

    .btn.secondary {
      color: var(--text);
      background: #fff;
      border-color: var(--line);
    }

    .btn.secondary:hover {
      background: var(--panel-soft);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.54;
    }

    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .status.error {
      color: var(--danger);
      font-weight: 700;
    }

    .workspace {
      min-width: 0;
      padding: 24px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 18px;
    }

    .summary {
      min-height: 58px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      padding: 10px 12px;
      min-width: 0;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .preview-shell {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px;
    }

    .preview-pane {
      min-width: 0;
      min-height: 360px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
    }

    .preview-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 28px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .stage {
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(45deg, #e5ebf2 25%, transparent 25%),
        linear-gradient(-45deg, #e5ebf2 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e5ebf2 75%),
        linear-gradient(-45deg, transparent 75%, #e5ebf2 75%);
      background-color: #f8fafc;
      background-size: 22px 22px;
      background-position: 0 0, 0 11px, 11px -11px, -11px 0;
      display: grid;
      place-items: center;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .stage img,
    .stage canvas {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      background: transparent;
      box-shadow: 0 10px 28px rgba(23, 32, 51, 0.18);
    }

    .canvas-wrap {
      max-width: 100%;
      max-height: 100%;
      display: grid;
      place-items: center;
      position: relative;
    }

    .canvas-wrap canvas,
    .split-overlay {
      grid-area: 1 / 1;
    }

    .split-overlay {
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image:
        linear-gradient(to right, transparent calc(100% - 1px), rgba(255, 255, 255, 0.9) calc(100% - 1px)),
        linear-gradient(to bottom, transparent calc(100% - 1px), rgba(255, 255, 255, 0.9) calc(100% - 1px));
      background-size: calc(100% / var(--cols)) 100%, 100% calc(100% / var(--rows));
      box-shadow: inset 0 0 0 1px rgba(17, 24, 39, 0.55);
      mix-blend-mode: difference;
    }

    .empty-state {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr 52px;
      gap: 10px;
      align-items: center;
    }

    input[type="range"] {
      accent-color: var(--accent);
      width: 100%;
    }

    .quality-value {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        min-height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .workspace {
        min-height: 640px;
      }
    }

    @media (max-width: 760px) {
      .sidebar,
      .workspace {
        padding: 16px;
      }

      .summary {
        grid-template-columns: 1fr 1fr;
      }

      .preview-shell {
        grid-template-columns: 1fr;
      }

      .preview-pane {
        min-height: 300px;
      }
    }

    @media (max-width: 460px) {
      .grid,
      .actions,
      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div class="brand-copy">
          <h1>图片尺寸工具</h1>
          <span>Resize, compress and slice locally</span>
        </div>
      </div>

      <section class="upload" id="dropZone">
        <input id="fileInput" type="file" accept="image/*" multiple>
        <label class="upload-label" for="fileInput">
          <strong>选择图片</strong>
          <span>支持多选或拖放到此处</span>
          <span class="file-name" id="fileName">未选择文件</span>
        </label>
      </section>

      <section class="panel" id="queuePanel" hidden>
        <p class="panel-title">图片列表</p>
        <div class="image-list" id="imageList"></div>
      </section>

      <section class="panel">
        <p class="panel-title">目标尺寸</p>
        <div class="grid">
          <div class="field">
            <label for="targetWidth">宽度 px</label>
            <input id="targetWidth" type="number" inputmode="numeric" min="1" step="1" value="1080">
          </div>
          <div class="field">
            <label for="targetHeight">高度 px</label>
            <input id="targetHeight" type="number" inputmode="numeric" min="1" step="1" value="1080">
          </div>
        </div>
        <label class="toggle">
          <input id="lockRatio" type="checkbox">
          <span>锁定原图比例</span>
        </label>
        <div class="preset-grid" id="presetGrid">
          <button class="preset-btn" type="button" data-width="640" data-height="640">640 x 640</button>
          <button class="preset-btn" type="button" data-width="1080" data-height="1080">1080 x 1080</button>
          <button class="preset-btn" type="button" data-width="1920" data-height="1080">16:9</button>
          <button class="preset-btn" type="button" data-width="1080" data-height="1920">9:16</button>
          <button class="preset-btn" type="button" data-width="1080" data-height="1440">3:4</button>
          <button class="preset-btn" type="button" data-width="1440" data-height="1080">4:3</button>
        </div>
      </section>

      <section class="panel">
        <p class="panel-title">适配方式</p>
        <div class="mode-list">
          <label class="mode-option">
            <input type="radio" name="fitMode" value="contain" checked>
            <span class="mode-copy">
              <span class="radio-title">完整显示</span>
              <small>保留全图，空白区域用背景色填充</small>
            </span>
          </label>
          <label class="mode-option">
            <input type="radio" name="fitMode" value="cover">
            <span class="mode-copy">
              <span class="radio-title">铺满裁剪</span>
              <small>铺满目标尺寸，超出部分居中裁剪</small>
            </span>
          </label>
          <label class="mode-option">
            <input type="radio" name="fitMode" value="stretch">
            <span class="mode-copy">
              <span class="radio-title">拉伸变形</span>
              <small>强制匹配目标宽高</small>
            </span>
          </label>
        </div>
        <div class="field stack" id="anchorField">
          <label for="cropAnchor">裁剪位置</label>
          <select id="cropAnchor">
            <option value="center">居中</option>
            <option value="top">顶部</option>
            <option value="bottom">底部</option>
            <option value="left">左侧</option>
            <option value="right">右侧</option>
            <option value="top-left">左上</option>
            <option value="top-right">右上</option>
            <option value="bottom-left">左下</option>
            <option value="bottom-right">右下</option>
          </select>
        </div>
      </section>

      <section class="panel">
        <p class="panel-title">导出</p>
        <div class="grid">
          <div class="field">
            <label for="format">格式</label>
            <select id="format">
              <option value="image/png">PNG</option>
              <option value="image/jpeg">JPEG</option>
              <option value="image/webp">WebP</option>
            </select>
          </div>
          <div class="field">
            <label for="backgroundColor">背景色</label>
            <input id="backgroundColor" type="color" value="#ffffff">
          </div>
        </div>
        <div class="field" id="qualityField">
          <label for="quality">质量</label>
          <div class="range-row">
            <input id="quality" type="range" min="1" max="100" value="92">
            <span class="quality-value" id="qualityValue">92%</span>
          </div>
        </div>
        <div class="field">
          <label for="maxSizeKb">文件大小上限 KB</label>
          <input id="maxSizeKb" type="number" inputmode="numeric" min="1" step="1" placeholder="例如 500，留空则不限">
        </div>
      </section>

      <section class="panel">
        <p class="panel-title">切图</p>
        <div class="grid">
          <div class="field">
            <label for="splitCols">列数 m</label>
            <input id="splitCols" type="number" inputmode="numeric" min="1" max="50" step="1" value="1">
          </div>
          <div class="field">
            <label for="splitRows">行数 n</label>
            <input id="splitRows" type="number" inputmode="numeric" min="1" max="50" step="1" value="1">
          </div>
        </div>
      </section>

      <div class="actions">
        <button class="btn secondary" id="resetBtn" type="button">重置</button>
        <button class="btn" id="downloadBtn" type="button" disabled>下载图片</button>
      </div>
      <div class="status" id="status"></div>
    </aside>

    <section class="workspace">
      <div class="summary">
        <div class="metric">
          <span>原图</span>
          <strong id="sourceMetric">-</strong>
        </div>
        <div class="metric">
          <span>目标</span>
          <strong id="targetMetric">1080 x 1080</strong>
        </div>
        <div class="metric">
          <span>比例</span>
          <strong id="ratioMetric">1:1</strong>
        </div>
        <div class="metric">
          <span>输出</span>
          <strong id="outputMetric">PNG</strong>
        </div>
        <div class="metric">
          <span>预估大小</span>
          <strong id="estimateMetric">-</strong>
        </div>
      </div>

      <div class="preview-shell">
        <section class="preview-pane">
          <div class="preview-title">
            <span>原图预览</span>
            <span id="sourceSizeLabel">-</span>
          </div>
          <div class="stage" id="sourceStage">
            <div class="empty-state">选择图片后显示</div>
          </div>
        </section>

        <section class="preview-pane">
          <div class="preview-title">
            <span>输出预览</span>
            <span id="outputSizeLabel">1080 x 1080</span>
          </div>
          <div class="stage" id="outputStage">
            <div class="canvas-wrap" id="canvasWrap" hidden>
              <canvas id="outputCanvas" width="1080" height="1080"></canvas>
              <div class="split-overlay" id="splitOverlay" hidden></div>
            </div>
            <div class="empty-state" id="outputEmpty">等待图片</div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const state = {
      image: null,
      images: [],
      activeIndex: -1,
      sourceUrl: "",
      sourceName: "",
      lastChangedDimension: "width",
      estimateTimer: 0,
      estimateToken: 0
    };

    const els = {
      fileInput: document.querySelector("#fileInput"),
      dropZone: document.querySelector("#dropZone"),
      fileName: document.querySelector("#fileName"),
      queuePanel: document.querySelector("#queuePanel"),
      imageList: document.querySelector("#imageList"),
      targetWidth: document.querySelector("#targetWidth"),
      targetHeight: document.querySelector("#targetHeight"),
      lockRatio: document.querySelector("#lockRatio"),
      presetGrid: document.querySelector("#presetGrid"),
      cropAnchor: document.querySelector("#cropAnchor"),
      anchorField: document.querySelector("#anchorField"),
      format: document.querySelector("#format"),
      backgroundColor: document.querySelector("#backgroundColor"),
      quality: document.querySelector("#quality"),
      qualityValue: document.querySelector("#qualityValue"),
      qualityField: document.querySelector("#qualityField"),
      maxSizeKb: document.querySelector("#maxSizeKb"),
      splitCols: document.querySelector("#splitCols"),
      splitRows: document.querySelector("#splitRows"),
      resetBtn: document.querySelector("#resetBtn"),
      downloadBtn: document.querySelector("#downloadBtn"),
      status: document.querySelector("#status"),
      sourceMetric: document.querySelector("#sourceMetric"),
      targetMetric: document.querySelector("#targetMetric"),
      ratioMetric: document.querySelector("#ratioMetric"),
      outputMetric: document.querySelector("#outputMetric"),
      estimateMetric: document.querySelector("#estimateMetric"),
      sourceStage: document.querySelector("#sourceStage"),
      canvasWrap: document.querySelector("#canvasWrap"),
      outputCanvas: document.querySelector("#outputCanvas"),
      outputEmpty: document.querySelector("#outputEmpty"),
      splitOverlay: document.querySelector("#splitOverlay"),
      sourceSizeLabel: document.querySelector("#sourceSizeLabel"),
      outputSizeLabel: document.querySelector("#outputSizeLabel")
    };

    const MAX_CANVAS_PIXELS = 268435456;
    const MAX_SIDE = 32767;
    const MAX_GRID_SIDE = 50;
    const MAX_TILE_COUNT = 400;

    function setStatus(message, isError = false) {
      els.status.textContent = message;
      els.status.classList.toggle("error", isError);
    }

    function getTargetSize() {
      const width = Math.max(1, Math.floor(Number(els.targetWidth.value) || 1));
      const height = Math.max(1, Math.floor(Number(els.targetHeight.value) || 1));
      return { width, height };
    }

    function setTargetSize(width, height) {
      els.targetWidth.value = String(Math.max(1, Math.round(width)));
      els.targetHeight.value = String(Math.max(1, Math.round(height)));
    }

    function getFitMode() {
      return document.querySelector('input[name="fitMode"]:checked').value;
    }

    function getAnchorPoint() {
      return {
        "top-left": { x: 0, y: 0 },
        top: { x: 0.5, y: 0 },
        "top-right": { x: 1, y: 0 },
        left: { x: 0, y: 0.5 },
        center: { x: 0.5, y: 0.5 },
        right: { x: 1, y: 0.5 },
        "bottom-left": { x: 0, y: 1 },
        bottom: { x: 0.5, y: 1 },
        "bottom-right": { x: 1, y: 1 }
      }[els.cropAnchor.value] || { x: 0.5, y: 0.5 };
    }

    function getExtension() {
      return {
        "image/png": "png",
        "image/jpeg": "jpg",
        "image/webp": "webp"
      }[els.format.value] || "png";
    }

    function getMaxSizeBytes() {
      const kb = Math.floor(Number(els.maxSizeKb.value) || 0);
      return kb > 0 ? kb * 1024 : 0;
    }

    function getSplitGrid() {
      const cols = Math.min(MAX_GRID_SIDE, Math.max(1, Math.floor(Number(els.splitCols.value) || 1)));
      const rows = Math.min(MAX_GRID_SIDE, Math.max(1, Math.floor(Number(els.splitRows.value) || 1)));
      return { cols, rows, count: cols * rows };
    }

    function sanitizeName(name) {
      return (name || "image").replace(/\.[^.]+$/, "").replace(/[\\/:*?"<>|]+/g, "_").trim() || "image";
    }

    function formatBytes(bytes) {
      if (bytes >= 1048576) {
        return `${(bytes / 1048576).toFixed(2)} MB`;
      }

      return `${Math.ceil(bytes / 1024)} KB`;
    }

    function gcd(a, b) {
      while (b) {
        const t = b;
        b = a % b;
        a = t;
      }
      return a || 1;
    }

    function updateMetrics() {
      const { width, height } = getTargetSize();
      const divisor = gcd(width, height);
      const outputName = els.format.options[els.format.selectedIndex].text;
      const { cols, rows, count } = getSplitGrid();

      els.targetMetric.textContent = `${width} x ${height}`;
      els.ratioMetric.textContent = `${width / divisor}:${height / divisor}`;
      els.outputMetric.textContent = count > 1 ? `${outputName} / ${cols}x${rows}` : outputName;
      els.outputSizeLabel.textContent = `${width} x ${height}`;
      els.qualityField.style.display = els.format.value === "image/png" ? "none" : "grid";
      els.anchorField.hidden = getFitMode() !== "cover";
      els.downloadBtn.textContent = state.images.length > 1 ? `批量下载 ${state.images.length} 张` : count > 1 ? `下载 ${count} 张切图` : "下载图片";
      updateSplitOverlay();

      if (state.image) {
        els.sourceMetric.textContent = `${state.image.naturalWidth} x ${state.image.naturalHeight}`;
        els.sourceSizeLabel.textContent = `${state.image.naturalWidth} x ${state.image.naturalHeight}`;
      }
    }

    function updateSplitOverlay() {
      const { cols, rows, count } = getSplitGrid();
      els.splitOverlay.hidden = count <= 1 || !state.image || els.canvasWrap.hidden;
      els.splitOverlay.style.setProperty("--cols", String(cols));
      els.splitOverlay.style.setProperty("--rows", String(rows));
    }

    function validateTargetSize(width, height) {
      if (width > MAX_SIDE || height > MAX_SIDE) {
        return `单边最大支持 ${MAX_SIDE}px`;
      }

      if (width * height > MAX_CANVAS_PIXELS) {
        return "目标像素过大，请降低宽度或高度";
      }

      return "";
    }

    function validateSplitGrid(width, height) {
      const { cols, rows, count } = getSplitGrid();

      if (count > MAX_TILE_COUNT) {
        return `一次最多切出 ${MAX_TILE_COUNT} 张图片`;
      }

      if (cols > width || rows > height) {
        return "切图行列数不能超过目标图片宽高像素";
      }

      return "";
    }

    function syncLockedRatio(changedKey) {
      if (!els.lockRatio.checked || !state.image) return;

      const sourceRatio = state.image.naturalWidth / state.image.naturalHeight;
      const { width, height } = getTargetSize();

      if (changedKey === "width") {
        els.targetHeight.value = String(Math.max(1, Math.round(width / sourceRatio)));
      } else {
        els.targetWidth.value = String(Math.max(1, Math.round(height * sourceRatio)));
      }
    }

    function drawOutput() {
      updateMetrics();

      if (!state.image) {
        els.canvasWrap.hidden = true;
        els.outputEmpty.hidden = false;
        els.downloadBtn.disabled = true;
        els.estimateMetric.textContent = "-";
        return;
      }

      const { width, height } = getTargetSize();
      const validation = validateTargetSize(width, height);
      if (validation) {
        els.canvasWrap.hidden = true;
        els.outputEmpty.hidden = false;
        els.downloadBtn.disabled = true;
        setStatus(validation, true);
        return;
      }

      const splitValidation = validateSplitGrid(width, height);
      if (splitValidation) {
        els.canvasWrap.hidden = true;
        els.outputEmpty.hidden = false;
        els.downloadBtn.disabled = true;
        setStatus(splitValidation, true);
        return;
      }

      const canvas = els.outputCanvas;
      drawImageToCanvas(state.image, canvas);

      els.canvasWrap.hidden = false;
      els.outputEmpty.hidden = true;
      els.downloadBtn.disabled = false;
      updateSplitOverlay();
      scheduleEstimate();
      setStatus("已生成预览");
    }

    function loadImageFile(file) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith("image/")) {
          reject(new Error("请选择图片文件"));
          return;
        }

        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            resolve({
              file,
              image: img,
              url: URL.createObjectURL(file),
              name: sanitizeName(file.name),
              displayName: file.name,
              width: img.naturalWidth,
              height: img.naturalHeight
            });
          };

          img.onerror = () => reject(new Error("图片加载失败"));
          img.src = reader.result;
        };

        reader.onerror = () => reject(new Error("文件读取失败"));
        reader.readAsDataURL(file);
      });
    }

    function renderImageList() {
      els.queuePanel.hidden = state.images.length <= 1;
      els.imageList.innerHTML = "";

      state.images.forEach((item, index) => {
        const button = document.createElement("button");
        button.className = `image-item${index === state.activeIndex ? " is-active" : ""}`;
        button.type = "button";

        const thumb = document.createElement("img");
        thumb.src = item.url;
        thumb.alt = "";

        const copy = document.createElement("span");
        const name = document.createElement("strong");
        const size = document.createElement("span");
        name.textContent = item.displayName;
        size.textContent = `${item.width} x ${item.height}`;
        copy.append(name, size);
        button.append(thumb, copy);

        button.addEventListener("click", () => activateImage(index, false));
        els.imageList.appendChild(button);
      });
    }

    function activateImage(index, syncSize = true) {
      const item = state.images[index];
      if (!item) return;

      state.activeIndex = index;
      state.image = item.image;
      state.sourceUrl = item.url;
      state.sourceName = item.name;
      els.fileName.textContent = state.images.length > 1 ? `${state.images.length} 张图片` : item.displayName;
      els.sourceStage.innerHTML = "";

      const preview = new Image();
      preview.src = item.url;
      preview.alt = item.displayName;
      els.sourceStage.appendChild(preview);

      if (syncSize && !els.lockRatio.checked) {
        setTargetSize(item.width, item.height);
      } else if (els.lockRatio.checked) {
        syncLockedRatio(state.lastChangedDimension);
      }

      renderImageList();
      drawOutput();
    }

    async function loadFiles(files) {
      const imageFiles = [...files].filter((file) => file.type.startsWith("image/"));
      if (imageFiles.length === 0) {
        setStatus("请选择图片文件", true);
        return;
      }

      state.images.forEach((item) => URL.revokeObjectURL(item.url));
      state.images = [];
      state.activeIndex = -1;
      setStatus(`正在加载 ${imageFiles.length} 张图片...`);

      try {
        state.images = await Promise.all(imageFiles.map(loadImageFile));
        activateImage(0, true);
        setStatus(`已加载 ${state.images.length} 张图片`);
      } catch (error) {
        setStatus(error.message || "图片加载失败", true);
      }
    }

    function loadFile(file) {
      loadFiles([file]);
    }

    function drawImageToCanvas(image, canvas) {
      const { width, height } = getTargetSize();
      const ctx = canvas.getContext("2d");
      canvas.width = width;
      canvas.height = height;

      ctx.clearRect(0, 0, width, height);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";

      if (els.format.value !== "image/png" || getFitMode() === "contain") {
        ctx.fillStyle = els.backgroundColor.value;
        ctx.fillRect(0, 0, width, height);
      }

      const sw = image.naturalWidth;
      const sh = image.naturalHeight;
      const fitMode = getFitMode();

      if (fitMode === "contain") {
        const scale = Math.min(width / sw, height / sh);
        const dw = Math.round(sw * scale);
        const dh = Math.round(sh * scale);
        const dx = Math.round((width - dw) / 2);
        const dy = Math.round((height - dh) / 2);
        ctx.drawImage(image, dx, dy, dw, dh);
      } else if (fitMode === "cover") {
        const scale = Math.max(width / sw, height / sh);
        const cropW = width / scale;
        const cropH = height / scale;
        const anchor = getAnchorPoint();
        const sx = (sw - cropW) * anchor.x;
        const sy = (sh - cropH) * anchor.y;
        ctx.drawImage(image, sx, sy, cropW, cropH, 0, 0, width, height);
      } else {
        ctx.drawImage(image, 0, 0, width, height);
      }
    }

    function canvasToBlob(canvas, mimeType, quality) {
      return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(blob), mimeType, quality);
      });
    }

    function makeCrcTable() {
      const table = [];
      for (let i = 0; i < 256; i += 1) {
        let c = i;
        for (let j = 0; j < 8; j += 1) {
          c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
        }
        table[i] = c >>> 0;
      }
      return table;
    }

    const crcTable = makeCrcTable();

    function crc32(bytes) {
      let crc = 0xffffffff;
      for (let i = 0; i < bytes.length; i += 1) {
        crc = crcTable[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
      }
      return (crc ^ 0xffffffff) >>> 0;
    }

    function writeUint16(bytes, value) {
      bytes.push(value & 0xff, (value >>> 8) & 0xff);
    }

    function writeUint32(bytes, value) {
      bytes.push(value & 0xff, (value >>> 8) & 0xff, (value >>> 16) & 0xff, (value >>> 24) & 0xff);
    }

    async function createZip(files) {
      const encoder = new TextEncoder();
      const chunks = [];
      const centralChunks = [];
      let offset = 0;

      for (const file of files) {
        const nameBytes = encoder.encode(file.name);
        const data = new Uint8Array(await file.blob.arrayBuffer());
        const crc = crc32(data);
        const local = [];

        writeUint32(local, 0x04034b50);
        writeUint16(local, 20);
        writeUint16(local, 0);
        writeUint16(local, 0);
        writeUint16(local, 0);
        writeUint16(local, 0);
        writeUint32(local, crc);
        writeUint32(local, data.length);
        writeUint32(local, data.length);
        writeUint16(local, nameBytes.length);
        writeUint16(local, 0);

        chunks.push(new Uint8Array(local), nameBytes, data);

        const central = [];
        writeUint32(central, 0x02014b50);
        writeUint16(central, 20);
        writeUint16(central, 20);
        writeUint16(central, 0);
        writeUint16(central, 0);
        writeUint16(central, 0);
        writeUint16(central, 0);
        writeUint32(central, crc);
        writeUint32(central, data.length);
        writeUint32(central, data.length);
        writeUint16(central, nameBytes.length);
        writeUint16(central, 0);
        writeUint16(central, 0);
        writeUint16(central, 0);
        writeUint16(central, 0);
        writeUint32(central, 0);
        writeUint32(central, offset);
        centralChunks.push(new Uint8Array(central), nameBytes);

        offset += local.length + nameBytes.length + data.length;
      }

      const centralSize = centralChunks.reduce((sum, chunk) => sum + chunk.length, 0);
      const end = [];
      writeUint32(end, 0x06054b50);
      writeUint16(end, 0);
      writeUint16(end, 0);
      writeUint16(end, files.length);
      writeUint16(end, files.length);
      writeUint32(end, centralSize);
      writeUint32(end, offset);
      writeUint16(end, 0);

      return new Blob([...chunks, ...centralChunks, new Uint8Array(end)], { type: "application/zip" });
    }

    async function createSizeLimitedBlob(canvas, requestedType, initialQuality, maxBytes) {
      let mimeType = requestedType;
      let extension = getExtension();
      let changedFormat = false;

      if (maxBytes > 0 && requestedType === "image/png") {
        mimeType = "image/jpeg";
        extension = "jpg";
        changedFormat = true;
      }

      if (maxBytes <= 0 || mimeType === "image/png") {
        const blob = await canvasToBlob(canvas, mimeType, initialQuality);
        return { blob, mimeType, extension, quality: initialQuality, changedFormat, limited: false };
      }

      const highestQuality = Math.min(1, Math.max(0.01, initialQuality || 0.92));
      let blob = await canvasToBlob(canvas, mimeType, highestQuality);
      if (!blob || blob.size <= maxBytes) {
        return { blob, mimeType, extension, quality: highestQuality, changedFormat, limited: true };
      }

      let low = 0.01;
      let high = highestQuality;
      let bestBlob = null;
      let bestQuality = low;

      for (let i = 0; i < 10; i += 1) {
        const mid = (low + high) / 2;
        blob = await canvasToBlob(canvas, mimeType, mid);
        if (!blob) break;

        if (blob.size <= maxBytes) {
          bestBlob = blob;
          bestQuality = mid;
          low = mid;
        } else {
          high = mid;
        }
      }

      if (bestBlob) {
        return { blob: bestBlob, mimeType, extension, quality: bestQuality, changedFormat, limited: true };
      }

      blob = await canvasToBlob(canvas, mimeType, 0.01);
      return { blob, mimeType, extension, quality: 0.01, changedFormat, limited: true, tooLarge: blob && blob.size > maxBytes };
    }

    function downloadBlob(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function scheduleEstimate() {
      clearTimeout(state.estimateTimer);
      if (!state.image || els.canvasWrap.hidden) {
        els.estimateMetric.textContent = "-";
        return;
      }

      els.estimateMetric.textContent = "计算中";
      const token = state.estimateToken + 1;
      state.estimateToken = token;

      state.estimateTimer = setTimeout(async () => {
        const maxBytes = getMaxSizeBytes();
        const quality = Number(els.quality.value) / 100;
        const mimeType = els.format.value;
        const { count } = getSplitGrid();

        try {
          if (count > 1) {
            const tileCanvas = document.createElement("canvas");
            const tileCtx = tileCanvas.getContext("2d");
            const { width, height } = getTargetSize();
            const { cols, rows } = getSplitGrid();
            let total = 0;

            for (let row = 0; row < rows; row += 1) {
              const sy = Math.floor((row * height) / rows);
              const nextY = Math.floor(((row + 1) * height) / rows);
              const tileHeight = nextY - sy;

              for (let col = 0; col < cols; col += 1) {
                const sx = Math.floor((col * width) / cols);
                const nextX = Math.floor(((col + 1) * width) / cols);
                const tileWidth = nextX - sx;
                tileCanvas.width = tileWidth;
                tileCanvas.height = tileHeight;
                tileCtx.clearRect(0, 0, tileWidth, tileHeight);
                tileCtx.drawImage(els.outputCanvas, sx, sy, tileWidth, tileHeight, 0, 0, tileWidth, tileHeight);
                const result = await createSizeLimitedBlob(tileCanvas, mimeType, quality, maxBytes);
                total += result.blob ? result.blob.size : 0;
              }
            }

            if (token === state.estimateToken) {
              els.estimateMetric.textContent = `${formatBytes(total)} / ${count} 张`;
            }
            return;
          }

          const result = await createSizeLimitedBlob(els.outputCanvas, mimeType, quality, maxBytes);
          if (token === state.estimateToken) {
            els.estimateMetric.textContent = result.blob ? formatBytes(result.blob.size) : "-";
          }
        } catch {
          if (token === state.estimateToken) {
            els.estimateMetric.textContent = "-";
          }
        }
      }, 250);
    }

    async function buildFilesFromCanvas(canvas, safeName) {
      const { width, height } = getTargetSize();
      const quality = Number(els.quality.value) / 100;
      const mimeType = els.format.value;
      const maxBytes = getMaxSizeBytes();
      const { cols, rows, count } = getSplitGrid();

      if (count > 1) {
        const files = [];
        const tileCanvas = document.createElement("canvas");
        const tileCtx = tileCanvas.getContext("2d");
        let changedFormat = false;
        let tooLargeCount = 0;
        let totalSize = 0;

        for (let row = 0; row < rows; row += 1) {
          const sy = Math.floor((row * height) / rows);
          const nextY = Math.floor(((row + 1) * height) / rows);
          const tileHeight = nextY - sy;

          for (let col = 0; col < cols; col += 1) {
            const sx = Math.floor((col * width) / cols);
            const nextX = Math.floor(((col + 1) * width) / cols);
            const tileWidth = nextX - sx;

            tileCanvas.width = tileWidth;
            tileCanvas.height = tileHeight;
            tileCtx.clearRect(0, 0, tileWidth, tileHeight);
            tileCtx.drawImage(canvas, sx, sy, tileWidth, tileHeight, 0, 0, tileWidth, tileHeight);

            const result = await createSizeLimitedBlob(tileCanvas, mimeType, quality, maxBytes);
            if (!result.blob) {
              throw new Error("切图导出失败");
            }

            changedFormat = changedFormat || result.changedFormat;
            tooLargeCount += result.tooLarge ? 1 : 0;
            totalSize += result.blob.size;
            files.push({
              name: `${safeName}_r${String(row + 1).padStart(2, "0")}_c${String(col + 1).padStart(2, "0")}_${tileWidth}x${tileHeight}.${result.extension}`,
              blob: result.blob
            });
          }
        }

        return { files, changedFormat, tooLargeCount, totalSize, count };
      }

      const result = await createSizeLimitedBlob(canvas, mimeType, quality, maxBytes);
      if (!result.blob) {
        throw new Error("导出失败");
      }

      return {
        files: [{
          name: `${safeName}_${width}x${height}.${result.extension}`,
          blob: result.blob
        }],
        changedFormat: result.changedFormat,
        tooLargeCount: result.tooLarge ? 1 : 0,
        totalSize: result.blob.size,
        count: 1,
        quality: result.quality,
        limited: result.limited
      };
    }

    async function downloadOutput() {
      if (!state.image) return;

      const { width, height } = getTargetSize();
      const validation = validateTargetSize(width, height);
      if (validation) {
        setStatus(validation, true);
        return;
      }

      const splitValidation = validateSplitGrid(width, height);
      if (splitValidation) {
        setStatus(splitValidation, true);
        return;
      }

      drawOutput();

      const maxBytes = getMaxSizeBytes();
      const { cols, rows, count } = getSplitGrid();

      els.downloadBtn.disabled = true;
      setStatus(state.images.length > 1 ? `正在批量处理 ${state.images.length} 张图片...` : count > 1 ? `正在切成 ${count} 张图片...` : maxBytes > 0 ? "正在压缩到目标大小..." : "正在导出...");

      try {
        if (state.images.length > 1) {
          const exportCanvas = document.createElement("canvas");
          const files = [];
          let totalSize = 0;
          let tooLargeCount = 0;
          let changedFormat = false;

          for (const item of state.images) {
            drawImageToCanvas(item.image, exportCanvas);
            const result = await buildFilesFromCanvas(exportCanvas, item.name);
            changedFormat = changedFormat || result.changedFormat;
            tooLargeCount += result.tooLargeCount;
            totalSize += result.totalSize;
            result.files.forEach((file) => {
              files.push({
                name: `${item.name}/${file.name}`,
                blob: file.blob
              });
            });
          }

          const zipBlob = await createZip(files);
          const zipName = `piccut_batch_${width}x${height}.zip`;
          downloadBlob(zipBlob, zipName);

          if (tooLargeCount > 0) {
            setStatus(`已导出 ${zipName}。其中 ${tooLargeCount} 张最低质量仍超过 ${formatBytes(maxBytes)}`, true);
          } else if (changedFormat) {
            setStatus(`已导出 ${zipName}，共 ${files.length} 个文件，总大小 ${formatBytes(totalSize)}。PNG 已自动改为 JPEG。`);
          } else {
            setStatus(`已导出 ${zipName}，共 ${files.length} 个文件，总大小 ${formatBytes(totalSize)}`);
          }
          return;
        }

        const result = await buildFilesFromCanvas(els.outputCanvas, state.sourceName || "image");

        if (result.files.length > 1) {
          const zipBlob = await createZip(result.files);
          const zipName = `${state.sourceName || "image"}_${width}x${height}_${cols}x${rows}.zip`;
          downloadBlob(zipBlob, zipName);

          if (result.tooLargeCount > 0) {
            setStatus(`已导出 ${zipName}。其中 ${result.tooLargeCount} 张最低质量仍超过 ${formatBytes(maxBytes)}`, true);
          } else if (result.changedFormat) {
            setStatus(`已导出 ${zipName}，共 ${result.count} 张，图片总大小 ${formatBytes(result.totalSize)}。PNG 已自动改为 JPEG。`);
          } else {
            setStatus(`已导出 ${zipName}，共 ${result.count} 张，图片总大小 ${formatBytes(result.totalSize)}`);
          }
          return;
        }

        const file = result.files[0];
        downloadBlob(file.blob, file.name);

        if (result.tooLargeCount > 0) {
          setStatus(`最低质量仍为 ${formatBytes(file.blob.size)}，无法低于 ${formatBytes(maxBytes)}`, true);
        } else if (result.changedFormat) {
          setStatus(`已导出 ${file.name}，大小 ${formatBytes(file.blob.size)}。PNG 无法可靠控大小，已自动改为 JPEG。`);
        } else if (result.limited) {
          setStatus(`已导出 ${file.name}，大小 ${formatBytes(file.blob.size)}，质量约 ${Math.round(result.quality * 100)}%`);
        } else {
          setStatus(`已导出 ${file.name}，大小 ${formatBytes(file.blob.size)}`);
        }
      } catch (error) {
        setStatus(error.message || "导出失败", true);
      } finally {
        els.downloadBtn.disabled = false;
      }
    }

    function resetAll() {
      clearTimeout(state.estimateTimer);
      state.estimateToken += 1;
      els.fileInput.value = "";
      els.fileName.textContent = "未选择文件";
      els.sourceStage.innerHTML = '<div class="empty-state">选择图片后显示</div>';
      els.canvasWrap.hidden = true;
      els.outputEmpty.hidden = false;
      els.sourceMetric.textContent = "-";
      els.sourceSizeLabel.textContent = "-";
      els.estimateMetric.textContent = "-";
      setTargetSize(1080, 1080);
      els.lockRatio.checked = false;
      els.format.value = "image/png";
      els.backgroundColor.value = "#ffffff";
      els.maxSizeKb.value = "";
      els.splitCols.value = "1";
      els.splitRows.value = "1";
      els.cropAnchor.value = "center";
      els.quality.value = "92";
      els.qualityValue.textContent = "92%";
      document.querySelector('input[name="fitMode"][value="contain"]').checked = true;
      state.images.forEach((item) => URL.revokeObjectURL(item.url));
      state.images = [];
      state.activeIndex = -1;
      state.image = null;
      state.sourceName = "";
      state.sourceUrl = "";
      els.queuePanel.hidden = true;
      els.imageList.innerHTML = "";
      els.downloadBtn.disabled = true;
      setStatus("");
      updateMetrics();
    }

    els.fileInput.addEventListener("change", (event) => {
      loadFiles(event.target.files);
    });

    els.dropZone.addEventListener("dragover", (event) => {
      event.preventDefault();
      els.dropZone.classList.add("is-dragging");
    });

    els.dropZone.addEventListener("dragleave", () => {
      els.dropZone.classList.remove("is-dragging");
    });

    els.dropZone.addEventListener("drop", (event) => {
      event.preventDefault();
      els.dropZone.classList.remove("is-dragging");
      loadFiles(event.dataTransfer.files);
    });

    els.targetWidth.addEventListener("input", () => {
      state.lastChangedDimension = "width";
      syncLockedRatio("width");
      drawOutput();
    });

    els.targetHeight.addEventListener("input", () => {
      state.lastChangedDimension = "height";
      syncLockedRatio("height");
      drawOutput();
    });

    els.lockRatio.addEventListener("change", () => {
      syncLockedRatio(state.lastChangedDimension);
      drawOutput();
    });

    document.querySelectorAll('input[name="fitMode"]').forEach((radio) => {
      radio.addEventListener("change", drawOutput);
    });

    els.presetGrid.addEventListener("click", (event) => {
      const button = event.target.closest(".preset-btn");
      if (!button) return;

      setTargetSize(Number(button.dataset.width), Number(button.dataset.height));
      drawOutput();
    });

    els.cropAnchor.addEventListener("change", drawOutput);
    els.format.addEventListener("change", drawOutput);
    els.backgroundColor.addEventListener("input", drawOutput);
    els.maxSizeKb.addEventListener("input", () => {
      updateMetrics();
      scheduleEstimate();
    });
    els.splitCols.addEventListener("input", drawOutput);
    els.splitRows.addEventListener("input", drawOutput);
    els.quality.addEventListener("input", () => {
      els.qualityValue.textContent = `${els.quality.value}%`;
      drawOutput();
    });
    els.resetBtn.addEventListener("click", resetAll);
    els.downloadBtn.addEventListener("click", downloadOutput);

    updateMetrics();
  </script>
</body>
</html>
